name: CI

on:
  push:
    branches: [main, 'dev/**', 'task/**']
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        # The suite builds its own temp DBs; no network or live services needed.
        run: python -m unittest discover -s . -p 'test_*.py' -v
      - name: Run script tests (tests/)
        # Plain-script suites with their own runner; each exits non-zero on failure.
        run: |
          python tests/test_large_file_transform.py
          python tests/test_model_metadata.py

  frontend-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc -b --noEmit
