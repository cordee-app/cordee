name: CLA

# Asks every pull-request author to accept CLA.md before merge. Contributors
# sign by commenting the sentence below on their PR; signatures are stored in
# signatures/version1/cla.json on the cla-signatures branch (never on main).
#
# The action (CLA Assistant Lite) is archived upstream; pinned to the v2.6.1
# commit so the code we run can never change.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA
    runs-on: ubuntu-latest
    # Public repo only: the private development repo mirrors this file.
    if: >-
      github.repository == 'cordee-app/cordee' && (
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')))
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/cordee-app/cordee/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          allowlist: dependabot[bot],github-actions[bot]
